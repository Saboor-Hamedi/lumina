<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="googleae54f49217d71b6d" />
  <title>Lumina - Official Application Site</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; color: var(--accent); }
    p { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }
    a:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lumina</h1>
    <p>A fast, local-first note-taking and thinking environment with intelligent cloud backup and mail capabilities.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="https://github.com/Saboor-Hamedi/lumina" target="_blank">GitHub Repository</a>
    </div>
  </div>
</body>
</html>
