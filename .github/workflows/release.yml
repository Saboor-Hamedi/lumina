name: Release Lumina

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      version: ${{ steps.resolve_tag.outputs.version }}

    steps:
      - name: Resolve release tag/version
        id: resolve_tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "Manual workflow_dispatch is not supported for publishing releases. Push a v* tag instead." >&2
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure draft release exists (single, shared across matrix)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; setting draft=true for asset upload."
            gh release edit "$TAG" --draft=true --repo "$GITHUB_REPOSITORY" || true
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Lumina ${{ steps.resolve_tag.outputs.version }}" \
              --generate-notes
          fi

  release:
    name: Build & Publish (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            # Universal binary: runs natively on BOTH Apple Silicon (M1-M4) and Intel Macs
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux Tauri Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Rust & Frontend Tests
        run: |
          cargo test -p lumina_core
          npm run test:run

      - name: Build Tauri 2.0 Installers
        env:
          APPLE_SIGNING_IDENTITY: '-'
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npx tauri build ${{ matrix.args }}

      - name: Upload Release Installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          find target -type f \( \
            -path "*/release/bundle/nsis/*.exe" -o \
            -path "*/release/bundle/msi/*.msi" -o \
            -path "*/release/bundle/dmg/*.dmg" -o \
            -path "*/release/bundle/appimage/*.AppImage" -o \
            -path "*/release/bundle/deb/*.deb" \
          \) -print -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

  finalize-release:
    name: Publish Release (Undraft & Mark Latest)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate SHA256SUMS.txt, latest.json, and undraft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          REPO="$GITHUB_REPOSITORY"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          mkdir -p release_assets
          gh release download "$TAG" --repo "$REPO" --dir release_assets --clobber || true

          if [ -n "$(ls -A release_assets 2>/dev/null)" ]; then
            (
              cd release_assets
              sha256sum * > SHA256SUMS.txt
            )
            gh release upload "$TAG" release_assets/SHA256SUMS.txt --repo "$REPO" --clobber
          fi

          python3 - "$TAG" "$VERSION" "$REPO" "$PUB_DATE" <<'PY'
          import json, os, sys

          tag, version, repo, pub_date = sys.argv[1:5]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          files = os.listdir("release_assets") if os.path.isdir("release_assets") else []

          def pick(pred):
              for f in sorted(files):
                  if pred(f.lower()):
                      return f"{base_url}/{f}"
              return None

          win_url = pick(lambda n: n.endswith("-setup.exe") or n.endswith(".msi") or n.endswith(".exe"))
          mac_univ = pick(lambda n: "universal" in n and n.endswith(".dmg"))
          mac_arm = pick(lambda n: ("aarch64" in n or "arm64" in n) and n.endswith(".dmg")) or mac_univ
          mac_x64 = pick(lambda n: ("x64" in n or "x86_64" in n) and n.endswith(".dmg")) or mac_univ
          linux_appimage = pick(lambda n: n.endswith(".appimage") or n.endswith(".deb"))

          platforms = {}
          if win_url:
              platforms["windows-x86_64"] = {"url": win_url, "signature": ""}
          if mac_univ:
              platforms["darwin-universal"] = {"url": mac_univ, "signature": ""}
          if mac_arm:
              platforms["darwin-aarch64"] = {"url": mac_arm, "signature": ""}
          if mac_x64:
              platforms["darwin-x64"] = {"url": mac_x64, "signature": ""}
              platforms["darwin-x86_64"] = {"url": mac_x64, "signature": ""}
          if linux_appimage:
              platforms["linux-x86_64"] = {"url": linux_appimage, "signature": ""}

          latest_payload = {
              "version": version,
              "notes": f"Lumina {tag}",
              "pub_date": pub_date,
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as fh:
              json.dump(latest_payload, fh, indent=2)
          PY

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
