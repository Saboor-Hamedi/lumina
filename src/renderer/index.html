<!doctype html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Cpath d='M24 5L41 16V32L24 43L7 32V16L24 5Z' stroke='%238b5cf6' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%238b5cf6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Fira+Code:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/assets/screenLoader.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' ipc: http://ipc.localhost https://ipc.localhost tauri: http://tauri.localhost; connect-src 'self' ipc: http://ipc.localhost https://ipc.localhost tauri: http://tauri.localhost http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* asset: http://asset.localhost https://asset.localhost blob: data: https://api.groq.com https://api.deepseek.com https://api.openai.com https://api.anthropic.com https://router.huggingface.co https://api-inference.huggingface.co https://cdn.jsdelivr.net https://gmail.googleapis.com https://www.googleapis.com https://api.github.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' blob: data: asset: http://asset.localhost https://asset.localhost https:; media-src 'self' blob: data: asset: http://asset.localhost https://asset.localhost; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' blob: data: asset: http://asset.localhost https://asset.localhost; child-src 'self' blob: data: asset:; object-src 'self' blob: data: asset:;"
    />
    <script>
      // Prevent Flash of Unstyled Content (FOUC) on First Launch & Refresh
      try {
        const themeId = localStorage.getItem('theme-id') || 'light'
        document.documentElement.setAttribute('data-theme', themeId)

        const activeColorsRaw = localStorage.getItem('lumina_active_theme_colors')
        if (activeColorsRaw) {
          const activeColors = JSON.parse(activeColorsRaw)
          const bootVars = [
            '--bg-app',
            '--bg-sidebar',
            '--text-main',
            '--text-muted',
            '--text-faint',
            '--text-accent',
            '--border-dim'
          ]
          for (let i = 0; i < bootVars.length; i++) {
            const key = bootVars[i]
            if (activeColors[key]) {
              document.documentElement.style.setProperty(key, activeColors[key])
            }
          }
        }

        const stored = localStorage.getItem('theme-colors')
        if (stored) {
          const colors = JSON.parse(stored)
          if (colors.themeAccentColor) {
            let accent = colors.themeAccentColor
            if (!accent.startsWith('#')) accent = '#' + accent
            document.documentElement.style.setProperty('--text-accent', accent)
          }
        }
      } catch (e) {}

      // Instant early progress animation while main.jsx bundles download & parse
      (function () {
        let p = 18
        const timer = setInterval(function () {
          const bar = document.getElementById('screen-loader-bar-fill')
          const pct = document.getElementById('screen-loader-percent')
          if (!bar || !pct) return
          // Respect any higher progress set by controller or scripts
          const currentText = parseInt(pct.textContent || '0', 10) || 0
          if (currentText > p) {
            p = currentText
          }
          if (p < 96) {
            p += Math.max(0.4, (96 - p) * 0.045)
            const rounded = Math.min(96, Math.round(p))
            bar.style.width = rounded + '%'
            pct.textContent = rounded + '%'
          } else {
            clearInterval(timer)
          }
        }, 80)
        window.__LUMINA_SCREEN_LOADER__ = {
          stopSimulation: function () {
            clearInterval(timer)
          }
        }
      })()
    </script>
  </head>

  <body>
    <div id="screen-loader" class="screen-loader-overlay" role="status" aria-live="polite">
      <div class="screen-loader-emblem-wrap">
        <div class="screen-loader-emblem">
          <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M24 5L41 16V32L24 43L7 32V16L24 5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.75"/>
            <circle cx="24" cy="24" r="3.5" fill="var(--text-accent, #8b5cf6)"/>
          </svg>
        </div>
      </div>
      <div class="screen-loader-title">Lumina</div>
      <div class="screen-loader-bar-container">
        <div class="screen-loader-bar-fill" id="screen-loader-bar-fill" style="width: 18%"></div>
      </div>
      <div class="screen-loader-footer">
        <span class="screen-loader-status" id="screen-loader-status">Opening workspace…</span>
        <span class="screen-loader-percent" id="screen-loader-percent">18%</span>
      </div>
      <div class="screen-loader-substatus" id="screen-loader-substatus"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
