<!doctype html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Cpath d='M24 5L41 16V32L24 43L7 32V16L24 5Z' stroke='%238b5cf6' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%238b5cf6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Fira+Code:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/assets/screenLoader.css" />
    <script src="/boot.js"></script>
  </head>

  <body>
    <div id="screen-loader" class="screen-loader-overlay" role="status" aria-live="polite">
      <div class="screen-loader-emblem-wrap">
        <div class="screen-loader-emblem">
          <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M24 5L41 16V32L24 43L7 32V16L24 5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.75"/>
            <circle cx="24" cy="24" r="3.5" fill="var(--text-accent, #8b5cf6)"/>
          </svg>
        </div>
      </div>
      <div class="screen-loader-title">Lumina</div>
      <div class="screen-loader-bar-container">
        <div class="screen-loader-bar-fill" id="screen-loader-bar-fill" style="width: 18%"></div>
      </div>
      <div class="screen-loader-footer">
        <span class="screen-loader-status" id="screen-loader-status">Opening workspace…</span>
        <span class="screen-loader-percent" id="screen-loader-percent">18%</span>
      </div>
      <div class="screen-loader-substatus" id="screen-loader-substatus"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
