[package]
name = "lumina_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "2.16"
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
memchr = "2.7"

[build-dependencies]
napi-build = "2.2"

