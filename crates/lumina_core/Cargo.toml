[package]
name = "lumina_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
memchr = "2.7"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
getrandom = "0.3"
flate2 = "1"
crc32fast = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lopdf = "0.34"
