[package]
name = "lumina_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.3"
flate2 = "1"
crc32fast = "1"
